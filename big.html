<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Claims — Large Print</title>
<link rel="stylesheet" href="big.css?v=20260731p">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128203;</text></svg>">
</head>
<body>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>

  <!-- No page title: the tabs already say what this is, and the space is
       better spent on the record itself. -->
  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-board="subrogation">Subrogations</button>
    <button class="tab" data-board="collection">Collections</button>
  </nav>

  <main class="card" id="card"></main>

  <p class="empty" id="empty" hidden>No records on this tab yet.</p>

  <!-- Big navigation. The record counter sits between the buttons rather than
       on a line of its own: it belongs with the controls it describes, and it
       buys back a whole row of vertical space. -->
  <nav class="pager">
    <button class="btn nav" id="prevBtn">
      <span class="nav-arrow">←</span><span>Back</span>
    </button>
    <p class="position" id="position"></p>
    <button class="btn nav" id="nextBtn">
      <span>Next</span><span class="nav-arrow">→</span>
    </button>
  </nav>

  <!-- The goal. Sticks to the bottom of the screen so it stays in view even
       when the details section is open and the page scrolls. -->
  <p class="total" id="total" hidden>
    <span class="total-label">Total to Collect</span>
    <span class="total-amount" id="totalAmount"></span>
  </p>
</div>

<!-- Nothing follows the pager on purpose. This view has no add, no delete, and
     no link out to the standard view: it reads and edits the record on screen,
     and that is all. The standard view links here, not the other way round. -->

<div id="toast" class="toast" hidden></div>
<div id="setupErr" class="setup-err" hidden></div>

<script src="config.js?v=20260731p"></script>
<script type="module" src="big.js?v=20260731p"></script>
</body>
</html>
