<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Claims — Large Print</title>
<link rel="stylesheet" href="big.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128203;</text></svg>">
</head>
<body>

<!-- ── App ───────────────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <h1>Claims</h1>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-board="subrogation">Subrogations</button>
    <button class="tab" data-board="collection">Collections</button>
  </nav>

  <p class="position" id="position"></p>

  <main class="card" id="card"></main>

  <p class="empty" id="empty" hidden>No records on this tab yet.</p>

  <!-- Big navigation. Kept well away from anything destructive. -->
  <nav class="pager">
    <button class="btn nav" id="prevBtn">
      <span class="nav-arrow">←</span><span>Back</span>
    </button>
    <button class="btn nav" id="nextBtn">
      <span>Next</span><span class="nav-arrow">→</span>
    </button>
  </nav>

  <div class="extras">
    <button class="btn wide" id="addRow">+ Add a new record</button>
    <a class="btn wide link" href="index.html">Switch to the standard view</a>
  </div>
</div>

<!-- ── Delete confirmation ───────────────────────────────────────────────── -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Delete this record?</h2>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="btn big-ghost" id="modalCancel">No, keep it</button>
      <button class="btn danger" id="modalConfirm">Yes, delete</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="setupErr" class="setup-err" hidden></div>

<script src="config.js"></script>
<script type="module" src="big.js"></script>
</body>
</html>
